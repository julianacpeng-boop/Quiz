name: Gerar videos JUH QUIZ

on:
  workflow_dispatch:
    inputs:
      videos:
        description: "Quais videos? Ex.: 1 | 1-5 | 61-65 | 1,3,69 | ALL"
        required: true
        default: "ALL"
        type: string

permissions:
  contents: read

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar FFmpeg e fontes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-color-emoji fontconfig

      - name: Instalar bibliotecas Python
        run: pip install -r requirements.txt

      - name: Gerar videos
        env:
          VIDEOS: ${{ inputs.videos }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_AUTHORIZED_USER_JSON: ${{ secrets.GOOGLE_AUTHORIZED_USER_JSON }}
          GOOGLE_DRIVE_OUTPUT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_OUTPUT_FOLDER_ID }}
        run: python gerar_videos.py

      - name: Guardar copia dos MP4 no GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JUH-QUIZ-videos-${{ github.run_number }}
          path: output/**/*.mp4
          if-no-files-found: warn
          retention-days: 7

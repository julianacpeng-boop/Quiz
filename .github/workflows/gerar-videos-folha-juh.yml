name: Gerar Juh Quiz Folha Animada

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar FFmpeg e fontes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation2 fontconfig

      - name: Instalar bibliotecas Python
        run: pip install -r requirements.txt

      - name: Gerar vídeos
        run: python -u gerar_videos_folha_juh.py

      - name: Guardar MP4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JUH-QUIZ-FOLHA-${{ github.run_number }}
          path: output_folha_juh/**/*.mp4
          if-no-files-found: error
          retention-days: 7

name: Gerar Juh Quiz Trend

on:
  workflow_dispatch:

jobs:
  gerar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar FFmpeg e fontes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation2 fontconfig

      - name: Instalar bibliotecas Python
        run: pip install -r requirements.txt

      - name: Gerar videos
        run: python -u gerar_juh_quiz_trend.py

      - name: Guardar MP4
        uses: actions/upload-artifact@v4
        with:
          name: JUH-QUIZ-TREND-${{ github.run_number }}
          path: output/*.mp4
          if-no-files-found: error
          retention-days: 7
